---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>
    <canvas id="ascii-sharks-bg" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;"></canvas>
    <div id="shark-overlay" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;background:rgba(255,255,255,0.7);"></div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}

      <article class="page{% unless page.author_profile %}no-sidebar{% endunless %}"  itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}
    <script src="/assets/js/ascii-sharks.js"></script>

  </body>
</html>
